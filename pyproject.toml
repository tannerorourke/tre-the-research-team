[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tre"
version = "0.1.0"
description = "A three-agent ML research system: a Research Scientist, a Tech Lead, and a Developer running typed workflow graphs on the Claude Agent SDK, grounded in your repo and docs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tanner O'Rourke" }]
keywords = ["agents", "ml-research", "claude", "graph", "orchestration"]
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
tre = "tre.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tre"]

# -- uvx rebuilds the plugin's server when its sources change, not only pyproject.toml
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
